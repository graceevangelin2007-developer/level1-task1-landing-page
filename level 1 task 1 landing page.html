<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">

    <!-- Header -->
    <header>
      <h1>My Landing Page</h1>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <h2>Welcome to My Project</h2>
      <p>Build amazing things using HTML & CSS.</p>
      <button>Get Started</button>
    </section>

    <!-- Footer -->
    <footer>
      <p>© 2026 Your Name</p>
    </footer>

  </div>

</body>
</html>
<style class="css">
  body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #dcdcdc;

  /* center the card */
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Main container */
.card {
  width: 70%;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Header */
header {
  background-color: #111827;
  color: white;
  text-align: center;
  padding: 20px;
}

/* Hero section */
.hero {
  text-align: center;
  padding: 80px 20px;
  background: linear-gradient(to right, #14b8a6, #1e3a8a);
  color: white;
}

.hero h2 {
  font-size: 40px;
  margin-bottom: 10px;
}

.hero p {
  font-size: 18px;
  margin-bottom: 25px;
}

/* Button */
.hero button {
  padding: 12px 25px;
  font-size: 16px;
  background-color: #fbbf24;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* Footer */
footer {
  background-color: #111827;
  color: white;
  text-align: center;
  padding: 15px;
}
</style>
